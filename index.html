:root[data-theme=&quot;light&quot;] {

}

:root[data-theme=&quot;dark&quot;] {

}

* {

}

html &gt; body {
  /* Preserve MCP aliases for older inline renderers without creating :root cycles. */

    --background,
    light-dark(rgb(255 255 255), rgb(24 24 24))
  );
  --color-text-primary: var(
    --foreground,
    light-dark(rgb(26 28 31), rgb(255 255 255))

  color: var(--foreground);

  font-family: var(--font-sans) !important;
  font-size: var(--font-size-normal);
  font-weight: var(--font-weight-normal);
  line-height: var(--line-height-normal);
}

.cursor-interaction {
  cursor: var(--cursor-interaction, pointer);
}

a {

  cursor: var(--cursor-interaction, pointer);
  font-weight: var(--font-weight-medium, 500);
  text-decoration: none;
  text-underline-offset: 2px;
}

a:is(:hover, :focus-visible) {
  text-decoration-line: underline;
  text-decoration-style: dashed;
  text-decoration-thickness: 0.5px;
}

h1,
h2,
h3,
h4,
h5,
h6,
p {

}

h1 {

  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h2 {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h3,
h4,
h5,
h6 {
  font-size: var(--font-size-h3);
  font-weight: var(--font-weight-medium);
  line-height: 1.3;
}

b,
strong,
th {
  font-weight: var(--font-weight-medium);
}

code:not(pre code) {

  padding: 1px 6px;
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background: var(--muted);
  font-family: var(--font-mono);

}

.table-responsive {

}

.table {

  color: var(--foreground);

  text-align: start;
}

.table :is(th, td) {

  padding-inline: 0 24px;
  overflow-wrap: anywhere;
  border-bottom: 1px solid var(--border);
  text-align: start;
  vertical-align: top;
}

.table-responsive &gt; .table :is(th, td) {
  overflow-wrap: break-word;
}

.table :is(th, td):last-child {
  padding-inline-end: 0;
}

.table :is(caption, thead th) {
  font-weight: 600;
}

.table thead th {
  padding-block: 8px;
  border-bottom-color: color-mix(in srgb, var(--foreground) 16%, transparent);
}

.table tbody tr:last-child :is(th, td) {
  border-bottom: 0;
}

.table.table-sm :is(th, td) {
  padding-block: 6px;
}

.table.table-sm :is(th, td):not(:last-child) {
  padding-inline-end: 16px;
}

.table :is(.text-end, [align=&quot;right&quot;]) {
  text-align: end;
  font-variant-numeric: tabular-nums;
}

.table :is(.text-center, [align=&quot;center&quot;]) {
  text-align: center;
}

.table .text-nowrap {
  white-space: nowrap;
}

#widget {
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
  padding: 0;
  background: transparent !important;
}

.card {
  min-width: 0;
  padding: 12px;
  overflow: hidden;
  overflow-wrap: break-word;
  border-radius: var(--radius-2xl);
  corner-shape: var(--corner-shape);
  color: var(--card-foreground);
  background: var(--card);
}

.widget {
  min-width: 0;
  overflow: hidden;
  border: 0;
  border-radius: var(--radius-lg);
  corner-shape: var(--corner-shape);
  box-shadow: 0 0 0 0.5px var(--border-strong, var(--border));
  color: var(--foreground);
  background: var(--background);
}

#widget &gt; :not(.card, .widget, .progress) {
  width: 100% !important;
  max-width: none !important;
  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
}

.tooltip {

  z-index: 50;
  top: 0;
  left: 0;
  width: max-content;
  max-width: min(
    20rem,
    var(--tooltip-available-width, calc(100vw - 10px)),
    calc(100vw - 10px)
  );
  max-height: min(
    var(--tooltip-available-height, calc(100vh - 10px)),
    calc(100vh - 10px)
  );
  padding: 4px 8px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  corner-shape: var(--corner-shape);
  color: var(--popover-foreground);
  background: var(--popover);
  box-shadow: none;
  font-size: var(--font-size-tooltip);
  line-height: var(--line-height-tooltip);

  white-space: normal;
  pointer-events: none;
  user-select: none;

.viz-grid {

}

.viz-stat {

.viz-stat-value {

  align-items: center;
  gap: 10px;
}

  margin-block: 6px;
  border: 0;
  background: var(--border);
}

.nav {

  min-width: 0;
  align-items: center;
  gap: 4px;
}

.progress {

}

}

.text-muted {

}

.tabular-nums {
  font-variant-numeric: tabular-nums;
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.viz-controls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}

.viz-controls &gt; .form-label {

  min-width: min(100%, 260px);
  flex: 1 1 280px;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: baseline;
  gap: 2px 12px;
  margin-bottom: 0;
}

.viz-controls &gt; .form-label &gt; :is(.form-control, .form-range, .form-select) {
  grid-column: 1 / -1;
}

.btn,
.nav-link,
.form-check-input,
.form-control,
.form-range,
.form-select {
  font: inherit;
}

.btn,
.nav-link {
  appearance: button;
  display: inline-flex;
  inline-size: fit-content;
  max-inline-size: 100%;
  min-height: 28px;
  align-items: center;
  justify-content: center;
  gap: 4px;
  margin: 0;

  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: var(--corner-shape);

.btn-primary {

  color: var(--primary-foreground);
  background: var(--foreground);
  background-clip: padding-box;
}

.btn-primary .text-muted {

.btn-primary:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 80%, transparent);

  border-color: transparent;
  color: var(--muted-foreground);
  background: transparent;

.nav-pills .nav-link.active {

            &lt;span class=&quot;crd-legend&quot;&gt;

        &lt;div class=&quot;crd-doc-body&quot;&gt;
          &lt;article class=&quot;crd-clause&quot; data-clause=&quot;1&quot;&gt;
            &lt;div class=&quot;crd-clause-head&quot;&gt;
              &lt;span class=&quot;crd-clause-no&quot;&gt;第 1 条&lt;/span&gt;
              &lt;h4 class=&quot;crd-clause-title&quot;&gt;合同主体与标的&lt;/h4&gt;
              &lt;span class=&quot;crd-chip crd-chip--ok&quot;&gt;合规通过&lt;/span&gt;
            &lt;/div&gt;
            &lt;p class=&quot;crd-clause-text&quot;&gt;甲方：东浩兰生集团有限公司（采购方）；乙方：智联装备（上海）有限公司（供应方）。双方主体资格、住所、联系人及送达地址信息完整。采购标的为智能仓储分拣设备 6 套，规格型号、数量、含税单价及总价已在附件中明确。&lt;/p&gt;
          &lt;/article&gt;

          &lt;article class=&quot;crd-clause&quot; data-clause=&quot;2&quot;&gt;
            &lt;div class=&quot;crd-clause-head&quot;&gt;
              &lt;span class=&quot;crd-clause-no&quot;&gt;第 2 条&lt;/span&gt;
              &lt;h4 class=&quot;crd-clause-title&quot;&gt;合同价款与支付&lt;/h4&gt;
              &lt;span class=&quot;crd-chip&quot; data-clause-status=&quot;2&quot;&gt;&lt;/span&gt;
            &lt;/div&gt;
            &lt;p class=&quot;crd-clause-text&quot;&gt;本合同含税总价为人民币 8,600,000.00 元。&lt;mark class=&quot;crd-mark crd-mark--high&quot; data-finding=&quot;f1&quot;&gt;合同签订后 7 个工作日内，甲方向乙方支付合同总额 50% 的预付款&lt;span class=&quot;crd-ref&quot;&gt;1&lt;/span&gt;&lt;/mark&gt;；设备安装调试并验收合格后 30 日内支付剩余款项。&lt;mark class=&quot;crd-mark crd-mark--info&quot; data-finding=&quot;f8&quot;&gt;乙方收到预付款后 5 个工作日内，向甲方开具合同全额增值税专用发票&lt;span class=&quot;crd-ref&quot;&gt;8&lt;/span&gt;&lt;/mark&gt;。&lt;/p&gt;
          &lt;/article&gt;

          &lt;article class=&quot;crd-clause&quot; data-clause=&quot;3&quot;&gt;
            &lt;div class=&quot;crd-clause-head&quot;&gt;
              &lt;span class=&quot;crd-clause-no&quot;&gt;第 3 条&lt;/span&gt;
              &lt;h4 class=&quot;crd-clause-title&quot;&gt;交付与验收&lt;/h4&gt;
              &lt;span class=&quot;crd-chip&quot; data-clause-status=&quot;3&quot;&gt;&lt;/span&gt;
            &lt;/div&gt;
            &lt;p class=&quot;crd-clause-text&quot;&gt;乙方应于 2026 年 12 月 31 日前完成设备交付、安装与调试。&lt;mark class=&quot;crd-mark crd-mark--mid&quot; data-finding=&quot;f3&quot;&gt;设备应符合甲方要求的标准&lt;span class=&quot;crd-ref&quot;&gt;3&lt;/span&gt;&lt;/mark&gt;，并具备连续 72 小时稳定运行能力。验收由甲方组织，验收合格后双方签署验收确认单。&lt;/p&gt;
          &lt;/article&gt;

          &lt;article class=&quot;crd-clause&quot; data-clause=&quot;4&quot;&gt;
            &lt;div class=&quot;crd-clause-head&quot;&gt;
              &lt;span class=&quot;crd-clause-no&quot;&gt;第 4 条&lt;/span&gt;
              &lt;h4 class=&quot;crd-clause-title&quot;&gt;违约责任&lt;/h4&gt;
              &lt;span class=&quot;crd-chip&quot; data-clause-status=&quot;4&quot;&gt;&lt;/span&gt;
            &lt;/div&gt;
            &lt;p class=&quot;crd-clause-text&quot;&gt;因乙方原因导致设备无法交付的，甲方有权解除合同并要求赔偿。&lt;mark class=&quot;crd-mark crd-mark--high&quot; data-finding=&quot;f2&quot;&gt;乙方逾期交付的，每逾期一日按合同总额的 0.05% 支付违约金，累计不超过合同总额的 5%；甲方无正当理由解除本合同的，应向乙方支付合同总额 30% 的违约金&lt;span class=&quot;crd-ref&quot;&gt;2&lt;/span&gt;&lt;/mark&gt;。&lt;/p&gt;
          &lt;/article&gt;

          &lt;article class=&quot;crd-clause&quot; data-clause=&quot;5&quot;&gt;
            &lt;div class=&quot;crd-clause-head&quot;&gt;
              &lt;span class=&quot;crd-clause-no&quot;&gt;第 5 条&lt;/span&gt;
              &lt;h4 class=&quot;crd-clause-title&quot;&gt;知识产权&lt;/h4&gt;
              &lt;span class=&quot;crd-chip&quot; data-clause-status=&quot;5&quot;&gt;&lt;/span&gt;
            &lt;/div&gt;
            &lt;p class=&quot;crd-clause-text&quot;&gt;&lt;mark class=&quot;crd-mark crd-mark--mid&quot; data-finding=&quot;f4&quot;&gt;乙方为履行本合同开发或提供的软件、技术文档、图纸等成果，知识产权均归乙方所有，甲方在合同期内仅享有非独占使用权&lt;span class=&quot;crd-ref&quot;&gt;4&lt;/span&gt;&lt;/mark&gt;。甲方提供的资料、商标权属不因本合同发生转移。&lt;/p&gt;
          &lt;/article&gt;

          &lt;article class=&quot;crd-clause&quot; data-clause=&quot;6&quot;&gt;
            &lt;div class=&quot;crd-clause-head&quot;&gt;
              &lt;span class=&quot;crd-clause-no&quot;&gt;第 6 条&lt;/span&gt;
              &lt;h4 class=&quot;crd-clause-title&quot;&gt;保密与数据安全&lt;/h4&gt;
              &lt;span class=&quot;crd-chip&quot; data-clause-status=&quot;6&quot;&gt;&lt;/span&gt;
            &lt;/div&gt;
            &lt;p class=&quot;crd-clause-text&quot;&gt;双方应对履约过程中知悉的对方商业秘密承担保密义务。&lt;mark class=&quot;crd-mark crd-mark--mid&quot; data-finding=&quot;f5&quot;&gt;保密期限为永久有效，且未约定法定披露、已公开信息等例外情形&lt;span class=&quot;crd-ref&quot;&gt;5&lt;/span&gt;&lt;/mark&gt;。&lt;mark class=&quot;crd-mark crd-mark--info&quot; data-finding=&quot;f9&quot;&gt;设备运行数据由乙方采集并回传至乙方云平台，用于设备运维与优化&lt;span class=&quot;crd-ref&quot;&gt;9&lt;/span&gt;&lt;/mark&gt;。未经对方书面许可，不得向第三方披露保密信息。&lt;/p&gt;
          &lt;/article&gt;

          &lt;article class=&quot;crd-clause&quot; data-clause=&quot;7&quot;&gt;
            &lt;div class=&quot;crd-clause-head&quot;&gt;
              &lt;span class=&quot;crd-clause-no&quot;&gt;第 7 条&lt;/span&gt;
              &lt;h4 class=&quot;crd-clause-title&quot;&gt;不可抗力&lt;/h4&gt;
              &lt;span class=&quot;crd-chip crd-chip--ok&quot;&gt;合规通过&lt;/span&gt;
            &lt;/div&gt;
            &lt;p class=&quot;crd-clause-text&quot;&gt;因地震、台风、疫情等不可抗力致使合同不能履行的，根据不可抗力的影响部分或全部免除责任；受影响方应在 15 日内通知对方并提供有效证明。&lt;/p&gt;
          &lt;/article&gt;

          &lt;article class=&quot;crd-clause&quot; data-clause=&quot;8&quot;&gt;
            &lt;div class=&quot;crd-clause-head&quot;&gt;
              &lt;span class=&quot;crd-clause-no&quot;&gt;第 8 条&lt;/span&gt;
              &lt;h4 class=&quot;crd-clause-title&quot;&gt;争议解决&lt;/h4&gt;
              &lt;span class=&quot;crd-chip&quot; data-clause-status=&quot;8&quot;&gt;&lt;/span&gt;
            &lt;/div&gt;
            &lt;p class=&quot;crd-clause-text&quot;&gt;本合同的订立、效力、解释与履行均适用中华人民共和国法律。&lt;mark class=&quot;crd-mark crd-mark--mid&quot; data-finding=&quot;f6&quot;&gt;因本合同引起的争议，双方应友好协商解决；协商不成的，提交乙方所在地仲裁委员会仲裁&lt;span class=&quot;crd-ref&quot;&gt;6&lt;/span&gt;&lt;/mark&gt;。&lt;/p&gt;
          &lt;/article&gt;

          &lt;article class=&quot;crd-clause&quot; data-clause=&quot;9&quot;&gt;
            &lt;div class=&quot;crd-clause-head&quot;&gt;
              &lt;span class=&quot;crd-clause-no&quot;&gt;第 9 条&lt;/span&gt;
              &lt;h4 class=&quot;crd-clause-title&quot;&gt;合同生效与期限&lt;/h4&gt;
              &lt;span class=&quot;crd-chip&quot; data-clause-status=&quot;9&quot;&gt;&lt;/span&gt;
            &lt;/div&gt;
            &lt;p class=&quot;crd-clause-text&quot;&gt;本合同自双方盖章之日起生效，有效期至 2027 年 4 月 30 日。&lt;mark class=&quot;crd-mark crd-mark--info&quot; data-finding=&quot;f7&quot;&gt;合同期满前 30 日，双方均未提出书面异议的，本合同自动续约一年，续约价格按原合同执行&lt;span class=&quot;crd-ref&quot;&gt;7&lt;/span&gt;&lt;/mark&gt;。&lt;/p&gt;
          &lt;/article&gt;
        &lt;/div&gt;
      &lt;/section&gt;

      &lt;aside class=&quot;crd-panel&quot; aria-label=&quot;AI 审查意见&quot;&gt;
        &lt;div class=&quot;crd-panel-head&quot;&gt;
          &lt;div class=&quot;crd-panel-title-row&quot;&gt;
            &lt;h3 class=&quot;crd-panel-title&quot;&gt;AI 审查意见&lt;/h3&gt;
            &lt;span class=&quot;crd-panel-count&quot; id=&quot;crd-count&quot; aria-live=&quot;polite&quot;&gt;显示 9 / 9&lt;/span&gt;
          &lt;/div&gt;
          &lt;div class=&quot;crd-filters&quot; role=&quot;group&quot; aria-label=&quot;按风险等级筛选&quot;&gt;
            &lt;button type=&quot;button&quot; class=&quot;crd-filter&quot; data-filter=&quot;all&quot; aria-pressed=&quot;true&quot;&gt;全部 9&lt;/button&gt;
            &lt;button type=&quot;button&quot; class=&quot;crd-filter&quot; data-filter=&quot;high&quot; aria-pressed=&quot;false&quot;&gt;高风险 2&lt;/button&gt;
            &lt;button type=&quot;button&quot; class=&quot;crd-filter&quot; data-filter=&quot;mid&quot; aria-pressed=&quot;false&quot;&gt;中风险 4&lt;/button&gt;
            &lt;button type=&quot;button&quot; class=&quot;crd-filter&quot; data-filter=&quot;info&quot; aria-pressed=&quot;false&quot;&gt;提示 3&lt;/button&gt;
          &lt;/div&gt;
        &lt;/div&gt;
        &lt;div class=&quot;crd-finding-list&quot; id=&quot;crd-finding-list&quot;&gt;&lt;/div&gt;
        &lt;p class=&quot;crd-panel-foot&quot;&gt;判定由规则库、法务知识库与大模型语义复核共同完成，结果供法务辅助决策，最终意见以人工确认为准。&lt;/p&gt;
      &lt;/aside&gt;
    &lt;/div&gt;

    &lt;div class=&quot;crd-overlay&quot; id=&quot;crd-report&quot; hidden&gt;
      &lt;div class=&quot;crd-modal&quot; role=&quot;dialog&quot; aria-modal=&quot;true&quot; aria-labelledby=&quot;crd-report-title&quot;&gt;
        &lt;div class=&quot;crd-modal-head&quot;&gt;
          &lt;div&gt;
            &lt;h3 class=&quot;crd-modal-title&quot; id=&quot;crd-report-title&quot;&gt;智能合同审核报告&lt;/h3&gt;
            &lt;p class=&quot;crd-modal-sub&quot;&gt;设备采购合同（评审稿）.docx · 生成时间 2026-10-08 14:32 · 审查引擎 v2.1 / 规则库 v3.2&lt;/p&gt;
          &lt;/div&gt;

            &lt;span class=&quot;crd-verdict-badge&quot;&gt;需修订后签署&lt;/span&gt;
            &lt;p&gt;共发现 9 项风险，其中高风险 2 项：预付款比例超限、违约责任明显不对等。建议完成修订并经法务复核后再进入签署流程。&lt;/p&gt;

          &lt;p class=&quot;crd-report-stats&quot;&gt;高风险 2 · 中风险 4 · 提示 3 · 已采纳 &lt;span id=&quot;crd-report-adopted&quot;&gt;0&lt;/span&gt;/9 · 条款覆盖 9/9&lt;/p&gt;
          &lt;div&gt;
            &lt;span class=&quot;crd-report-label&quot;&gt;重点修订建议&lt;/span&gt;
            &lt;ol class=&quot;crd-report-list&quot;&gt;
              &lt;li&gt;将预付款比例由 50% 降至 30%，并要求乙方提供等额预付款保函；&lt;/li&gt;
              &lt;li&gt;对等设置违约责任，提高乙方逾期违约金上限、下调甲方解约违约金；&lt;/li&gt;
              &lt;li&gt;量化验收标准，引用技术规格书与国家标准指标，避免“甲方要求”式表述。&lt;/li&gt;
            &lt;/ol&gt;

          &lt;button type=&quot;button&quot; class=&quot;crd-btn crd-btn--primary&quot; id=&quot;crd-export-word&quot;&gt;导出 Word&lt;/button&gt;

  &lt;script&gt;
    (function () {
      &quot;use strict&quot;;
      var root = document.getElementById(&quot;crd&quot;);
      if (!root) {
        return;
      }

      var SEV = {
        high: { label: &quot;高风险&quot; },
        mid: { label: &quot;中风险&quot; },
        info: { label: &quot;提示&quot; }
      };

      var findings = [
        {
          id: &quot;f1&quot;,
          sev: &quot;high&quot;,
          clause: 2,
          source: &quot;规则库命中&quot;,
          title: &quot;预付款比例超限且无履约担保&quot;,
          quote: &quot;“合同签订后 7 个工作日内……支付合同总额 50% 的预付款”&quot;,
          desc: &quot;预付款比例达到合同总额的 50%，超过集团制度规定的 30% 上限，且未要求乙方提供履约担保或预付款保函，资金占用与履约风险较高。&quot;,
          basis: &quot;《集团合同管理办法》第 18 条：采购类合同预付款原则上不超过合同金额的 30%；确需超出的，应经分管领导审批并要求提供等额担保。&quot;,
          suggestion: &quot;预付款调整为合同总额的 30%，乙方同步提供等额预付款保函；设备验收合格后 30 日内支付至合同总额的 95%，剩余 5% 作为质保金，于质保期满且无遗留问题后支付。&quot;
        },
        {
          id: &quot;f2&quot;,
          sev: &quot;high&quot;,
          clause: 4,
          source: &quot;语义审查&quot;,
          title: &quot;违约责任权责不对等&quot;,
          quote: &quot;“甲方解约违约金 30% vs 乙方逾期违约金累计上限 5%”&quot;,
          desc: &quot;甲方单方解除的违约金高达合同总额的 30%，而乙方逾期交付违约金累计上限仅为 5%，双方责任明显失衡，整体条款明显偏向乙方。&quot;,
          basis: &quot;法务知识库 · 案例 FSC-2024-073（违约责任不对等被法院调整）；《民法典》第 585 条关于违约金过高可请求调整的规定。&quot;,
          suggestion: &quot;乙方逾期交付违约金累计上限提高至合同总额的 20%，并赔偿由此造成的实际损失；甲方无正当理由解除合同的违约金调整为合同总额的 10%，或按乙方实际损失据实赔偿。&quot;
        },
        {
          id: &quot;f3&quot;,
          sev: &quot;mid&quot;,
          clause: 3,
          source: &quot;规则库命中&quot;,
          title: &quot;验收标准表述模糊&quot;,
          quote: &quot;“设备应符合甲方要求的标准”&quot;,
          desc: &quot;“符合甲方要求的标准”缺乏可量化、可验证的验收依据，实操中易产生争议，也不利于验收付款节点的认定。&quot;,
          basis: &quot;法务知识库 · 案例 FSC-2024-073（验收标准约定不明引发争议）；集团《采购合同示范文本》验收条款指引。&quot;,
          suggestion: &quot;设备应符合附件《技术规格书》及国家、行业相关标准（如 GB/T 相关标准），并满足连续 72 小时稳定运行、分拣准确率不低于 99.5% 等量化指标；验收流程与整改期限以附件为准。&quot;
        },
        {
          id: &quot;f4&quot;,
          sev: &quot;mid&quot;,
          clause: 5,
          source: &quot;语义审查&quot;,
          title: &quot;定制成果知识产权归乙方&quot;,
          quote: &quot;“软件、技术文档、图纸等成果知识产权均归乙方所有”&quot;,
          desc: &quot;乙方为履行合同开发的软件、文档等成果知识产权全部归乙方，甲方仅获非独占使用权，后续二次开发或更换供应商可能受制于乙方。&quot;,
          basis: &quot;集团《知识产权管理办法》第 12 条：委托开发成果原则上应约定归集团所有，或由集团享有独占许可。&quot;,
          suggestion: &quot;乙方为履行本合同专门开发、定制形成的软件与文档，知识产权归甲方所有；乙方原有技术成果授予甲方永久、免费、可转授权的使用许可。&quot;
        },
        {
          id: &quot;f5&quot;,
          sev: &quot;mid&quot;,
          clause: 6,
          source: &quot;语义审查&quot;,
          title: &quot;保密条款缺少例外情形&quot;,
          quote: &quot;“保密期限为永久有效，未约定例外情形”&quot;,
          desc: &quot;保密期限约定为“永久有效”，且未列明法定披露、已公开信息等例外情形，条款可执行性不足，存在被认定约定不明的风险。&quot;,
          basis: &quot;《民法典》第 501 条商业秘密保密义务；集团《商业秘密保护指引》第 7 条关于保密期限与例外情形的规定。&quot;,
          suggestion: &quot;保密期限调整为合同终止后 5 年（涉商业秘密可约定长期有效），并增加例外情形：信息已进入公有领域、依法律法规或监管要求披露、经披露方书面同意等。&quot;
        },
        {
          id: &quot;f6&quot;,
          sev: &quot;mid&quot;,
          clause: 8,
          source: &quot;规则库命中&quot;,
          title: &quot;争议解决约定对方所在地管辖&quot;,
          quote: &quot;“提交乙方所在地仲裁委员会仲裁”&quot;,
          desc: &quot;约定由乙方所在地仲裁机构管辖，一旦发生争议集团需异地应诉，维权成本与结果不确定性明显增加。&quot;,
          basis: &quot;《集团合同管理办法》第 26 条：争议解决条款应优先约定集团住所地法院或仲裁机构。&quot;,
          suggestion: &quot;因本合同引起的争议，双方应友好协商解决；协商不成的，提交上海仲裁委员会按其届时有效的仲裁规则仲裁，仲裁裁决为终局裁决。&quot;
        },
        {
          id: &quot;f7&quot;,
          sev: &quot;info&quot;,
          clause: 9,
          source: &quot;规则库命中&quot;,
          title: &quot;自动续约缺乏退出机制&quot;,
          quote: &quot;“双方均未提出异议的，自动续约一年”&quot;,
          desc: &quot;合同期满未提出异议即自动续约且价格不变，可能形成长期锁定，缺少价格复核与退出安排。&quot;,
          basis: &quot;集团《采购管理办法》第 22 条：长期合同应设置价格调整与年度评审机制。&quot;,
          suggestion: &quot;删去自动续约条款，或约定续约需双方书面确认，且续约前完成价格复核与供应商履约评价；任一方可提前 60 日书面通知不再续约。&quot;
        },
        {
          id: &quot;f8&quot;,
          sev: &quot;info&quot;,
          clause: 2,
          source: &quot;规则库命中&quot;,
          title: &quot;预付款后即开具全额发票&quot;,
          quote: &quot;“收到预付款后即开具合同全额发票”&quot;,
          desc: &quot;乙方于预付款到账后即开具全额发票，若合同提前终止或金额调整，将产生发票红冲与税款占用的操作成本。&quot;,
          basis: &quot;集团《财务报销与发票管理办法》第 9 条：发票开具应与实际结算进度匹配。&quot;,
          suggestion: &quot;发票按实际结算进度分批开具：预付款到账后开具 30% 金额的发票，验收合格并支付尾款后开具剩余金额发票。&quot;
        },
        {
          id: &quot;f9&quot;,
          sev: &quot;info&quot;,
          clause: 6,
          source: &quot;语义审查&quot;,
          title: &quot;数据回传缺少安全约定&quot;,
          quote: &quot;“运行数据由乙方采集并回传至乙方云平台”&quot;,
          desc: &quot;设备运行数据回传至乙方云平台，但未约定数据权属、存储位置、安全保护与个人信息保护措施，存在数据合规风险。&quot;,
          basis: &quot;《数据安全法》第 27 条数据安全保护义务；集团《数据安全管理办法（试行）》第 5 条关于数据权属与处理范围的规定。&quot;,
          suggestion: &quot;增加数据安全条款：设备运行数据权属归甲方，乙方仅在运维必要范围内处理并采取加密、访问控制等措施；涉及个人信息时，双方另行签署数据处理协议。&quot;
        }
      ];

      var state = { openId: &quot;f1&quot;, filter: &quot;all&quot;, adopted: {}, scanning: false };
      var listEl = root.querySelector(&quot;#crd-finding-list&quot;);
      var countEl = root.querySelector(&quot;#crd-count&quot;);
      var adoptedEl = root.querySelector(&quot;#crd-adopted&quot;);
      var locateEl = root.querySelector(&quot;#crd-locate&quot;);
      var toastEl = root.querySelector(&quot;#crd-toast&quot;);
      var scanEl = root.querySelector(&quot;#crd-scan&quot;);
      var scanFill = root.querySelector(&quot;#crd-scan-fill&quot;);
      var scanLabel = root.querySelector(&quot;#crd-scan-label&quot;);
      var overlay = root.querySelector(&quot;#crd-report&quot;);
      var reportAdoptedEl = root.querySelector(&quot;#crd-report-adopted&quot;);
      var cards = {};
      var toastTimer = null;
      var lastFocus = null;

      function esc(value) {
        return String(value).replace(/[&amp;&lt;&gt;&quot;]/g, function (ch) {
          return { &quot;&amp;&quot;: &quot;&amp;amp;&quot;, &quot;&lt;&quot;: &quot;&amp;lt;&quot;, &quot;&gt;&quot;: &quot;&amp;gt;&quot;, &#x27;&quot;&#x27;: &quot;&amp;quot;&quot; }[ch];
        });
      }

      function cardHTML(f) {
        return (
          &#x27;&lt;article class=&quot;crd-finding&quot; data-id=&quot;&#x27; + f.id + &#x27;&quot; data-sev=&quot;&#x27; + f.sev + &#x27;&quot;&gt;&#x27; +
            &#x27;&lt;button type=&quot;button&quot; class=&quot;crd-finding-head&quot; aria-expanded=&quot;false&quot; aria-controls=&quot;crd-detail-&#x27; + f.id + &#x27;&quot;&gt;&#x27; +
              &#x27;&lt;span class=&quot;crd-row1&quot;&gt;&#x27; +
                &#x27;&lt;span class=&quot;crd-sev crd-sev--&#x27; + f.sev + &#x27;&quot;&gt;&#x27; + SEV[f.sev].label + &quot;&lt;/span&gt;&quot; +
                &#x27;&lt;span class=&quot;crd-finding-title&quot;&gt;&#x27; + esc(f.title) + &quot;&lt;/span&gt;&quot; +
                &#x27;&lt;span class=&quot;crd-adopted-tag&quot; hidden&gt;已采纳&lt;/span&gt;&#x27; +
                &#x27;&lt;span class=&quot;crd-finding-loc&quot;&gt;第 &#x27; + f.clause + &quot; 条&lt;/span&gt;&quot; +
              &quot;&lt;/span&gt;&quot; +
              &#x27;&lt;span class=&quot;crd-row2&quot;&gt;&#x27; +
                &#x27;&lt;span class=&quot;crd-src&quot;&gt;&#x27; + esc(f.source) + &quot;&lt;/span&gt;&quot; +
                &#x27;&lt;span class=&quot;crd-quote&quot;&gt;&#x27; + esc(f.quote) + &quot;&lt;/span&gt;&quot; +
              &quot;&lt;/span&gt;&quot; +
            &quot;&lt;/button&gt;&quot; +
            &#x27;&lt;div class=&quot;crd-finding-detail&quot; id=&quot;crd-detail-&#x27; + f.id + &#x27;&quot; hidden&gt;&#x27; +
              &#x27;&lt;p class=&quot;crd-desc&quot;&gt;&#x27; + esc(f.desc) + &quot;&lt;/p&gt;&quot; +
              &#x27;&lt;div class=&quot;crd-basis&quot;&gt;&lt;span class=&quot;crd-basis-label&quot;&gt;判定依据&lt;/span&gt;&lt;p&gt;&#x27; + esc(f.basis) + &quot;&lt;/p&gt;&lt;/div&gt;&quot; +
              &#x27;&lt;div class=&quot;crd-suggest&quot;&gt;&#x27; +
                &#x27;&lt;div class=&quot;crd-suggest-head&quot;&gt;&lt;span&gt;建议修改&lt;/span&gt;&#x27; +
                &#x27;&lt;button type=&quot;button&quot; class=&quot;crd-adopt&quot; data-adopt=&quot;&#x27; + f.id + &#x27;&quot; aria-pressed=&quot;false&quot;&gt;采纳建议&lt;/button&gt;&lt;/div&gt;&#x27; +
                &#x27;&lt;p class=&quot;crd-suggest-text&quot;&gt;&#x27; + esc(f.suggestion) + &quot;&lt;/p&gt;&quot; +
              &quot;&lt;/div&gt;&quot; +
            &quot;&lt;/div&gt;&quot; +
          &quot;&lt;/article&gt;&quot;
        );
      }

      findings.forEach(function (f) {
        listEl.insertAdjacentHTML(&quot;beforeend&quot;, cardHTML(f));
      });
      findings.forEach(function (f) {
        cards[f.id] = listEl.querySelector(&#x27;[data-id=&quot;&#x27; + f.id + &#x27;&quot;]&#x27;);
      });

      function clauseFindings(n) {
        return findings.filter(function (f) {
          return f.clause === n;
        });
      }

      function adoptedCount() {
        return findings.filter(function (f) {
          return state.adopted[f.id];
        }).length;
      }

      function paintClauseStatus() {
        root.querySelectorAll(&quot;[data-clause-status]&quot;).forEach(function (chip) {
          var n = Number(chip.getAttribute(&quot;data-clause-status&quot;));
          var list = clauseFindings(n);
          if (!list.length) {
            return;
          }
          var adopted = list.filter(function (f) {
            return state.adopted[f.id];
          }).length;
          var worst = list.some(function (f) {
            return f.sev === &quot;high&quot;;
          }) ? &quot;high&quot; : list.some(function (f) {
            return f.sev === &quot;mid&quot;;
          }) ? &quot;mid&quot; : &quot;info&quot;;
          chip.className = &quot;crd-chip crd-chip--&quot; + worst;
          chip.textContent = &quot;命中 &quot; + list.length + &quot; 项&quot; + (adopted ? &quot; · 已采纳 &quot; + adopted : &quot;&quot;);
        });
      }

      function openFinding(id) {
        state.openId = id;
        var target = null;
        findings.forEach(function (f) {
          if (f.id === id) {
            target = f;
          }
          var card = cards[f.id];
          var head = card.querySelector(&quot;.crd-finding-head&quot;);
          var detail = card.querySelector(&quot;.crd-finding-detail&quot;);
          var open = f.id === id;
          head.setAttribute(&quot;aria-expanded&quot;, open ? &quot;true&quot; : &quot;false&quot;);
          detail.hidden = !open;
          card.classList.toggle(&quot;is-open&quot;, open);
        });
        root.querySelectorAll(&quot;.crd-finding&quot;).forEach(function (card) {
          card.classList.toggle(&quot;is-active&quot;, card.getAttribute(&quot;data-id&quot;) === id);
        });
        root.querySelectorAll(&quot;.crd-mark&quot;).forEach(function (mark) {
          mark.classList.toggle(&quot;is-active&quot;, mark.getAttribute(&quot;data-finding&quot;) === id);
        });
        root.querySelectorAll(&quot;.crd-clause&quot;).forEach(function (clause) {
          clause.classList.remove(&quot;is-active&quot;);
        });
        if (target) {
          var clauseEl = root.querySelector(&#x27;.crd-clause[data-clause=&quot;&#x27; + target.clause + &#x27;&quot;]&#x27;);
          if (clauseEl) {
            clauseEl.classList.add(&quot;is-active&quot;);
          }
          locateEl.classList.add(&quot;is-hit&quot;);
          locateEl.innerHTML = &#x27;&lt;span&gt;已定位：第 &#x27; + target.clause + &quot; 条 · &quot; + esc(target.title) + &quot;&lt;/span&gt;&quot;;
        }
      }

      function toast(message, anchor) {
        toastEl.textContent = message;
        toastEl.hidden = false;
        toastEl.style.top = &quot;&quot;;
        toastEl.style.bottom = &quot;&quot;;
        toastEl.style.left = &quot;&quot;;
        toastEl.style.transform = &quot;&quot;;
        if (anchor) {
          var win = root.querySelector(&quot;.crd-window&quot;);
          if (win) {
            var winRect = win.getBoundingClientRect();
            var anchorRect = anchor.getBoundingClientRect();
            var left = anchorRect.left - winRect.left + anchorRect.width / 2;
            var top = anchorRect.bottom - winRect.top + 8;
            toastEl.style.top = top + &quot;px&quot;;
            toastEl.style.bottom = &quot;auto&quot;;
            toastEl.style.left = left + &quot;px&quot;;
            toastEl.style.transform = &quot;translateX(-50%)&quot;;
            var width = toastEl.offsetWidth;
            var minLeft = width / 2 + 8;
            var maxLeft = winRect.width - width / 2 - 8;
            if (maxLeft &gt; minLeft) {
              left = Math.min(Math.max(left, minLeft), maxLeft);
              toastEl.style.left = left + &quot;px&quot;;
            }
